name: TV apps

# Builds both television versions of the Gracie Barra round timer and attaches the
# installable files to the run, because neither can be built on the gym laptop.
on:
  push:
    paths:
      - 'tv/**'
      - 'timer/**'
      - '.github/workflows/tv-apps.yml'
  pull_request:
    paths:
      - 'tv/**'
  workflow_dispatch:

jobs:
  shared:
    name: Shared timer engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Session engine tests
        run: node tv/tests/timer-core.test.js
      - name: The published browser build matches the shared layer
        run: tv/tools/build-web.sh --check

  android:
    name: Android TV (apk)
    runs-on: ubuntu-latest
    needs: shared
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        working-directory: tv/android-tv
        run: ./gradlew --no-daemon test
      - name: Assemble
        working-directory: tv/android-tv
        run: ./gradlew --no-daemon assembleRelease assembleDebug
      - name: Collect the apks
        uses: actions/upload-artifact@v4
        with:
          name: gracie-barra-timer-android-tv
          path: |
            tv/android-tv/app/build/outputs/apk/release/*.apk
            tv/android-tv/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  samsung:
    name: Samsung TV (wgt)
    runs-on: ubuntu-latest
    needs: shared
    steps:
      - uses: actions/checkout@v4
      - name: Package
        working-directory: tv/samsung-tv
        run: ./build-wgt.sh
      # Unsigned on purpose: a retail Samsung TV needs a package signed with the
      # gym's own Samsung certificate, which cannot live in a public workflow.
      # Sign it locally with ./build-wgt.sh <profile>, or from Tizen Studio.
      - name: Collect the package
        uses: actions/upload-artifact@v4
        with:
          name: gracie-barra-timer-samsung-tv-unsigned
          path: tv/samsung-tv/build/GracieBarraTimer.wgt
          if-no-files-found: error
